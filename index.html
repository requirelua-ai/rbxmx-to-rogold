<!DOCTYPE html><html><head><meta charset="UTF-8"><title>RBXMX to RoGold</title><style>
body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
h2 { margin-bottom: 4px; }
p { color: #555; margin-bottom: 16px; }
input[type=file] { display: block; margin-bottom: 12px; }
#status { margin-bottom: 12px; font-weight: bold; }
#status.err { color: red; }
#status.ok { color: green; }
textarea { width: 100%; height: 400px; font-family: monospace; font-size: 12px; }
button { margin-top: 8px; margin-right: 8px; padding: 6px 14px; cursor: pointer; }
</style></head><body><h2>RBXMX to RoGold Converter</h2><input type="file" id="fileInput" accept=".rbxmx"><div id="status"></div><textarea id="out" placeholder="Output will appear here..." readonly></textarea><br><button onclick="copyIt()">Copy</button><button onclick="downloadIt()">Download rogold.json</button><script>
let result = null;
document.getElementById('fileInput').addEventListener('change', function(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = function(ev) {
try {
const text = ev.target.result;
if (!text.trimStart().startsWith('<')) {
setStatus('Error: binary .rbxm not supported.', true);
return;
}
result = convert(text);
document.getElementById('out').value = JSON.stringify(result, null, 2);
const n = Object.keys(result.objects).length;
setStatus('Done! ' + n + ' object(s) converted.', false);
} catch(err) {
setStatus('Error: ' + err.message, true);
}
};
reader.readAsText(file);
});
function setStatus(msg, isErr) {
const el = document.getElementById('status');
el.textContent = msg;
el.className = isErr ? 'err' : 'ok';
}
function convert(xmlText) {
const parser = new DOMParser();
const doc = parser.parseFromString(xmlText, 'application/xml');
const objects = {};
const scripts = {};
const nameCount = {};
function getName(base) {
if (!(base in nameCount)) { nameCount[base] = 0; return base; }
nameCount[base]++;
return base + '_' + nameCount[base];
}
function getProp(propsEl, tag, name) {
if (!propsEl) return null;
const els = propsEl.children;
for (let i = 0; i < els.length; i++) {
if (els[i].tagName === tag && els[i].getAttribute('name') === name) {
return els[i];
}
}
return null;
}
function getP(propsEl, names, tags, fallback) {
if (!propsEl) return fallback;
const nameArr = Array.isArray(names) ? names : [names];
const tagArr = Array.isArray(tags) ? tags : [tags];
for (const name of nameArr) {
for (const tag of tagArr) {
const el = getProp(propsEl, tag, name);
if (el !== null) return el;
}
}
return null;
}
function readBool(el, fallback) {
if (!el) return fallback;
return el.textContent.trim() === 'true';
}
function readFloat(el, fallback) {
if (!el) return fallback;
const v = parseFloat(el.textContent.trim());
return isNaN(v) ? fallback : v;
}
function readString(el, fallback) {
if (!el) return fallback;
return el.textContent;
}
function readVector3(el, fallback) {
if (!el) return fallback;
const x = parseFloat(el.querySelector('X')?.textContent || 0);
const y = parseFloat(el.querySelector('Y')?.textContent || 0);
const z = parseFloat(el.querySelector('Z')?.textContent || 0);
return [x, y, z];
}
function readColor(el, fallback) {
if (!el) return fallback;
const tag = el.tagName;
if (tag === 'Color3uint8') {
const v = parseInt(el.textContent.trim(), 10);
return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
}
const r = el.querySelector('R');
if (r) {
return [
parseFloat(el.querySelector('R').textContent),
parseFloat(el.querySelector('G').textContent),
parseFloat(el.querySelector('B').textContent)
];
}
return fallback;
}
function readCFrame(el) {
if (!el) return { pos: [0,0,0], rot: [0,0,0] };
const x = parseFloat(el.querySelector("X")?.textContent || 0);
const y = parseFloat(el.querySelector("Y")?.textContent || 0);
const z = parseFloat(el.querySelector("Z")?.textContent || 0);
const r00 = parseFloat(el.querySelector("R00")?.textContent || 1);
const r01 = parseFloat(el.querySelector("R01")?.textContent || 0);
const r02 = parseFloat(el.querySelector("R02")?.textContent || 0);
const r10 = parseFloat(el.querySelector("R10")?.textContent || 0);
const r11 = parseFloat(el.querySelector("R11")?.textContent || 1);
const r12 = parseFloat(el.querySelector("R12")?.textContent || 0);
const r20 = parseFloat(el.querySelector("R20")?.textContent || 0);
const r21 = parseFloat(el.querySelector("R21")?.textContent || 0);
const r22 = parseFloat(el.querySelector("R22")?.textContent || 1);
const sinY = -r20;
const ry = Math.asin(Math.max(-1, Math.min(1, sinY)));
let rx, rz;
if (Math.abs(r20) < 0.9999) { rx = Math.atan2(r21, r22); rz = Math.atan2(r10, r00); }
else { rx = Math.atan2(-r12, r11); rz = 0; }
function ca(a) { const d = a * 180 / Math.PI; if (Math.abs(d) < 0.01) return 0; if (Math.abs(Math.abs(d) - 180) < 0.1) return 0; return parseFloat(d.toFixed(4)); }
return { pos: [x, y, z], rot: [ca(rx), ca(ry), ca(rz)] };
}
const matToTex = {
'256': null,
'272': null,
'288': null,
'304': 'imgs/woodenplanks.png',
'320': 'imgs/slate.png',
'336': 'imgs/concrete.png',
'352': 'imgs/metal.png',
'368': 'imgs/diamondplate.png',
'384': null,
'400': 'imgs/grass.png',
'416': 'imgs/ice.png',
'432': 'imgs/marble.png',
'448': 'imgs/granite.png',
'464': 'imgs/brick.png',
'480': 'imgs/pebble.png',
'496': 'imgs/sand.png',
'512': null,
'528': 'imgs/metal.png',
'544': 'imgs/woodenplanks.png',
'560': 'imgs/cobblestone.png',
'576': null,
'608': null,
'624': null,
Plastic: null, SmoothPlastic: null, Neon: null, ForceField: null, Glass: null,
Wood: 'imgs/woodenplanks.png', WoodPlanks: 'imgs/woodenplanks.png',
Slate: 'imgs/slate.png', Concrete: 'imgs/concrete.png',
CorrodedMetal: 'imgs/metal.png', DiamondPlate: 'imgs/diamondplate.png',
Grass: 'imgs/grass.png', Ice: 'imgs/ice.png', Marble: 'imgs/marble.png',
Granite: 'imgs/granite.png', Brick: 'imgs/brick.png', Pebble: 'imgs/pebble.png',
Sand: 'imgs/sand.png', Metal: 'imgs/metal.png', Cobblestone: 'imgs/cobblestone.png',
SandStone: 'imgs/sandstone.png',
};
function processItem(itemEl, parentName, parentClass) {
const className = itemEl.getAttribute('class') || 'Unknown';
const propsEl = itemEl.querySelector(':scope > Properties');
const nameEl = getProp(propsEl, 'string', 'Name');
const rawName = nameEl ? nameEl.textContent : className;
const key = getName(rawName);
const skipClasses = ['Model', 'Folder', 'Configuration', 'Weld', 'Snap', 'Motor6D', 'SpecialMesh', 'SelectionBox', 'SurfaceAppearance'];
if (skipClasses.includes(className)) {
const ch = itemEl.children;
for (let i = 0; i < ch.length; i++) {
if (ch[i].tagName === 'Item') processItem(ch[i], parentName, parentClass);
}
return;
}
const services = ['Lighting', 'ReplicatedStorage', 'ServerStorage', 'StarterGui', 'StarterPack', 'SoundService', 'Teams'];
const outParent = services.includes(className) ? null : 'Workspace';
if (className === 'Lighting') {
const timeEl = getProp(propsEl, 'float', 'TimeOfDay') || getProp(propsEl, 'double', 'TimeOfDay');
objects[key] = {
ClassName: 'Lighting',
Name: rawName,
Parent: null,
Time: readFloat(timeEl, 14)
};
} else {
const obj = {
ClassName: className,
Name: rawName,
Parent: outParent,
Anchored: false,
CanCollide: true,
Size: [4, 4, 4],
Position: [0, 0, 0],
Rotation: [0, 0, 0],
Color: [0.5, 0.5, 0.5],
Transparency: 0,
TextureUrl: null,
TextureScale: 1,
TextureMode: 'Tile',
TextureOffsetX: 0,
TextureOffsetY: 0,
TextureSpeed: 0,
BackgroundTransparency: null,
TextTransparency: null,
TextColor3: null,
TextSize: null,
Text: '',
Source: '',
type: '',
soundId: '',
volume: 0.5,
looping: false,
isPlaying: false
};
const partClasses = ['Part', 'BasePart', 'SpawnLocation', 'MeshPart', 'UnionOperation', 'SpecialMesh', 'WedgePart', 'TrussPart', 'CornerWedgePart'];
if (partClasses.includes(className)) {
obj.Anchored = readBool(getProp(propsEl, 'bool', 'Anchored'), false);
obj.CanCollide = readBool(getProp(propsEl, 'bool', 'CanCollide'), true);
obj.Transparency = readFloat(getProp(propsEl, 'float', 'Transparency'), 0);
const sizeEl = getProp(propsEl, 'Vector3', 'size') || getProp(propsEl, 'Vector3', 'Size');
obj.Size = readVector3(sizeEl, [4, 4, 4]);
const cfEl = getProp(propsEl, 'CoordinateFrame', 'CFrame');
if (cfEl) {
const cf = readCFrame(cfEl);
obj.Position = cf.pos;
obj.Rotation = cf.rot;
}
const colorEl = getProp(propsEl, 'Color3uint8', 'Color3uint8') || getProp(propsEl, 'Color3uint8', 'Color') || getProp(propsEl, 'Color3', 'Color');
obj.Color = readColor(colorEl, [0.5, 0.5, 0.5]);
const matEl = getProp(propsEl, 'token', 'Material');
if (matEl) {
const mat = matEl.textContent.trim().replace('Enum.Material.', '');
if (matToTex[mat] !== undefined) obj.TextureUrl = matToTex[mat];
}
}
if (['Script', 'LocalScript', 'ModuleScript'].includes(className)) {
const srcEl = getProp(propsEl, 'ProtectedString', 'Source') || getProp(propsEl, 'string', 'Source');
obj.Source = readString(srcEl, '');
scripts[key] = { ClassName: className, Name: rawName, Parent: parentName, Source: obj.Source };
}
if (className === 'Sound') {
const sidEl = getProp(propsEl, 'Content', 'SoundId') || getProp(propsEl, 'string', 'SoundId');
obj.soundId = readString(sidEl, '');
obj.volume = readFloat(getProp(propsEl, 'float', 'Volume'), 0.5);
obj.looping = readBool(getProp(propsEl, 'bool', 'Looping'), false);
obj.isPlaying = readBool(getProp(propsEl, 'bool', 'Playing'), false);
}
if (['TextLabel', 'TextButton', 'TextBox'].includes(className)) {
obj.Text = readString(getProp(propsEl, 'string', 'Text'), '');
obj.TextSize = readFloat(getProp(propsEl, 'int', 'TextSize'), null);
obj.BackgroundTransparency = readFloat(getProp(propsEl, 'float', 'BackgroundTransparency'), null);
obj.TextTransparency = readFloat(getProp(propsEl, 'float', 'TextTransparency'), null);
const tcEl = getProp(propsEl, 'Color3uint8', 'TextColor3') || getProp(propsEl, 'Color3', 'TextColor3');
obj.TextColor3 = readColor(tcEl, null);
}
objects[key] = obj;
}
const children = itemEl.children;
for (let i = 0; i < children.length; i++) {
if (children[i].tagName === 'Item') {
processItem(children[i], rawName, className);
}
}
}
const root = doc.querySelector('roblox');
if (!root) throw new Error('Invalid file.');
const topItems = root.children;
for (let i = 0; i < topItems.length; i++) {
if (topItems[i].tagName === 'Item') {
processItem(topItems[i], null, null);
}
}
if (Object.keys(objects).length === 0) {
throw new Error('No objects found.');
}
const hasBaseplate = Object.values(objects).some(o => o.Name === 'Baseplate' && o.ClassName === 'Part');
if (!hasBaseplate) {
objects['Baseplate'] = {
ClassName: 'Part',
Name: 'Baseplate',
Parent: null,
Anchored: true,
CanCollide: true,
Size: [500, 1, 500],
Position: [0, -0.5, 0],
Rotation: [0, 0, 0],
Color: [0.5, 0.5, 0.5],
Transparency: 0,
TextureUrl: 'imgs/studs.png',
TextureScale: 4,
TextureMode: 'Tile',
TextureOffsetX: 0,
TextureOffsetY: 0,
TextureSpeed: 0,
BackgroundTransparency: null,
TextTransparency: null,
TextColor3: null,
TextSize: null,
Text: '',
Source: '',
type: '',
soundId: '',
volume: 0.5,
looping: false,
isPlaying: false
};
}
return {
scripts,
objects,
timestamp: new Date().toISOString(),
engineVersion: '1.0.0',
studio: 'RoGold Studio'
};
}
function copyIt() {
if (!result) return;
navigator.clipboard.writeText(JSON.stringify(result, null, 2));
alert('Copied!');
}
function downloadIt() {
if (!result) return;
const a = document.createElement('a');
a.href = URL.createObjectURL(new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' }));
a.download = 'rogold.json';
a.click();
}
</script></body></html>
